version: "3.8"

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vacancy_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
